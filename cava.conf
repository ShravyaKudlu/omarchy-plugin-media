# cava config for the mystaryo.media bar widget.
# parecord->fifo bridge (cava 0.10.x pulse/pipewire inputs attach but read
# zeros on this system; parecord demonstrably captures full-scale). The
# widget wrapper kills stale fifo writers at startup so hot-reloads can't
# stack multiple writers (interleaved bytes = flat bars).
[general]
framerate = 30
bars_number = 12
autosens = 1
sensitivity = 240
[input]
method = fifo
source = /tmp/mystaryo-media-cava.fifo
sample_rate = 48000
sample_bits = 16
channels = 2
[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
[smoothing]
noise_reduction = 12
